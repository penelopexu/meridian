name: 翻译问题 / Translation
description: 某种语言的文案不地道、有错、或想新增语言
labels: [i18n]
body:
  - type: dropdown
    id: lang
    attributes:
      label: 哪种语言
      options: [简体中文, 繁體中文, English, 日本語, 한국어, Español, Français, Deutsch, العربية, 想新增一种语言]
    validations: { required: true }

  - type: input
    id: key
    attributes:
      label: 文案的 key（如果知道）
      description: 在 src/js/10-i18n.js 里搜得到的那个键名
      placeholder: advSwingBig

  - type: textarea
    id: current
    attributes:
      label: 当前显示
    validations: { required: true }

  - type: textarea
    id: better
    attributes:
      label: 建议改成
    validations: { required: true }

  - type: markdown
    attributes:
      value: |
        **想新增语言？** 只需在 `src/js/10-i18n.js` 的 `LOCALES`、`LANG_NAMES`、`STRINGS` 各补一项，共约 455 条文案。`npm run test:i18n` 会检查完整性。
        农历、二十四节气、中国传统节日名在所有语言下都保留中文原文，只翻译说明标签。
